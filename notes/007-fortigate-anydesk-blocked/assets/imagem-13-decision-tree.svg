<svg viewBox="0 0 1100 1250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow13g" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#4b5563"/>
    </marker>
  </defs>
  <rect width="1100" height="1250" fill="#0a0e14"/>
  <text x="550" y="46" font-family="Consolas,monospace" font-size="15" fill="#8b949e" text-anchor="middle" letter-spacing="3">REMOTE ACCESS DECISION TREE</text>
  <line x1="440" y1="62" x2="660" y2="62" stroke="#21262d" stroke-width="1"/>

  <g font-family="Consolas,monospace" font-size="12">

    <!-- Q1 Remote Access Detected? -->
    <polygon points="550,90 650,130 550,170 450,130" fill="#0d1421" stroke="#58a6ff" stroke-width="1.8"/>
    <text x="550" y="126" fill="#e6edf3" text-anchor="middle" font-size="9.5">Remote Access</text>
    <text x="550" y="140" fill="#e6edf3" text-anchor="middle" font-size="9.5">Detected?</text>
    <text x="590" y="112" fill="#3fb950" font-size="10">YES</text>
    <line x1="550" y1="170" x2="550" y2="202" stroke="#4b5563" stroke-width="1.8" marker-end="url(#arrow13g)"/>

    <!-- Q2 Traffic Blocked? -->
    <polygon points="550,204 660,254 550,304 440,254" fill="#0d1421" stroke="#58a6ff" stroke-width="1.8"/>
    <text x="550" y="259" fill="#e6edf3" text-anchor="middle" font-size="10.5">Blocked?</text>
    <!-- NO branch -->
    <line x1="660" y1="254" x2="800" y2="254" stroke="#d29922" stroke-width="1.6" marker-end="url(#arrow13g)"/>
    <text x="686" y="247" fill="#d29922" font-size="10.5">NO</text>
    <rect x="802" y="222" width="250" height="64" rx="8" fill="#1a1608" stroke="#d29922" stroke-width="1.6"/>
    <text x="927" y="248" fill="#d29922" text-anchor="middle" font-weight="700" font-size="10.5">Analyze Connection</text>
    <text x="927" y="266" fill="#d29922" text-anchor="middle" font-weight="700" font-size="10">→ Escalate per Evidence</text>
    <text x="590" y="315" fill="#3fb950" font-size="10">YES</text>
    <line x1="550" y1="304" x2="550" y2="336" stroke="#4b5563" stroke-width="1.8" marker-end="url(#arrow13g)"/>

    <!-- Q3 Authorization Status? (3-way) -->
    <polygon points="550,338 670,393 550,448 430,393" fill="#0d1421" stroke="#58a6ff" stroke-width="1.8"/>
    <text x="550" y="389" fill="#e6edf3" text-anchor="middle" font-size="9">AUTHORIZATION</text>
    <text x="550" y="403" fill="#e6edf3" text-anchor="middle" font-size="9">STATUS?</text>

    <!-- AUTHORIZED branch -->
    <line x1="670" y1="393" x2="850" y2="365" stroke="#3fb950" stroke-width="1.6" marker-end="url(#arrow13g)"/>
    <text x="700" y="368" fill="#3fb950" font-size="9.5">AUTHORIZED</text>
    <rect x="852" y="330" width="230" height="90" rx="8" fill="#0f1f14" stroke="#3fb950" stroke-width="1.6"/>
    <text x="967" y="352" fill="#3fb950" text-anchor="middle" font-weight="700" font-size="10">Activity Expected?</text>
    <text x="967" y="374" fill="#e6edf3" text-anchor="middle" font-size="9.5">YES → LEGITIMATE /</text>
    <text x="967" y="388" fill="#e6edf3" text-anchor="middle" font-size="9.5">AUTHORIZED</text>
    <text x="967" y="406" fill="#e6edf3" text-anchor="middle" font-size="9.5">NO → INVESTIGATE ANOMALY</text>

    <!-- UNAUTHORIZED branch (this case's real outcome) -->
    <line x1="430" y1="393" x2="250" y2="393" stroke="#3fb950" stroke-width="1.6" marker-end="url(#arrow13g)"/>
    <text x="345" y="386" fill="#3fb950" font-size="9.5">UNAUTHORIZED</text>
    <rect x="40" y="330" width="270" height="120" rx="8" fill="#0f1f14" stroke="#3fb950" stroke-width="2"/>
    <text x="175" y="352" fill="#f0883e" text-anchor="middle" font-weight="700" font-size="10">POLICY / ENDPOINT</text>
    <text x="175" y="368" fill="#f0883e" text-anchor="middle" font-weight="700" font-size="10">INVESTIGATION</text>
    <text x="175" y="390" fill="#e6edf3" text-anchor="middle" font-size="9">Block already applied +</text>
    <text x="175" y="404" fill="#e6edf3" text-anchor="middle" font-size="9">compromise not confirmed</text>
    <text x="175" y="424" fill="#3fb950" text-anchor="middle" font-weight="700" font-size="10.5">CONTENÇÃO PREVENTIVA</text>
    <text x="175" y="440" fill="#3fb950" text-anchor="middle" font-size="9">corrective action: GPO</text>

    <!-- NOT CONFIRMED / UNKNOWN branch (this case) -->
    <text x="595" y="465" fill="#d29922" font-size="10">NOT CONFIRMED / UNKNOWN</text>
    <line x1="550" y1="448" x2="550" y2="480" stroke="#4b5563" stroke-width="1.8" marker-end="url(#arrow13g)"/>

    <!-- Validate Asset (plain step) -->
    <rect x="450" y="482" width="200" height="46" rx="8" fill="#0d1421" stroke="#8b949e" stroke-width="1.6"/>
    <text x="550" y="510" fill="#e6edf3" text-anchor="middle" font-weight="700" font-size="11">Validate Asset</text>
    <line x1="550" y1="528" x2="550" y2="558" stroke="#4b5563" stroke-width="1.8" marker-end="url(#arrow13g)"/>

    <!-- Q4 Process / User Available? -->
    <polygon points="550,560 680,614 550,668 420,614" fill="#0d1421" stroke="#58a6ff" stroke-width="1.8"/>
    <text x="550" y="610" fill="#e6edf3" text-anchor="middle" font-size="10">Process / User</text>
    <text x="550" y="624" fill="#e6edf3" text-anchor="middle" font-size="10">Available?</text>
    <!-- YES branch -->
    <line x1="680" y1="614" x2="820" y2="614" stroke="#3fb950" stroke-width="1.6" marker-end="url(#arrow13g)"/>
    <text x="736" y="607" fill="#3fb950" font-size="10.5">YES</text>
    <rect x="822" y="588" width="230" height="52" rx="8" fill="#0f1f14" stroke="#3fb950" stroke-width="1.6"/>
    <text x="937" y="619" fill="#3fb950" text-anchor="middle" font-weight="700" font-size="11">Analyze Process / User</text>
    <text x="595" y="659" fill="#8b949e" font-size="10">NO</text>
    <line x1="550" y1="668" x2="550" y2="698" stroke="#4b5563" stroke-width="1.8" marker-end="url(#arrow13g)"/>

    <!-- NOT AVAILABLE waypoint -->
    <polygon points="490,700 550,686 610,700 610,746 550,760 490,746" fill="#15161a" stroke="#8b949e" stroke-width="2.2" stroke-dasharray="6 3"/>
    <text x="550" y="727" fill="#8b949e" text-anchor="middle" font-weight="700" font-size="10.5">NOT</text>
    <text x="550" y="743" fill="#8b949e" text-anchor="middle" font-weight="700" font-size="10.5">AVAILABLE</text>
    <text x="660" y="712" fill="#6b7280" font-size="10" font-style="italic">intermediate state</text>
    <text x="660" y="727" fill="#6b7280" font-size="10" font-style="italic">— not a conclusion</text>
    <line x1="550" y1="760" x2="550" y2="792" stroke="#4b5563" stroke-width="1.8" marker-end="url(#arrow13g)"/>

    <!-- Q5 Remote Session Confirmed? -->
    <polygon points="550,794 670,844 550,894 430,844" fill="#0d1421" stroke="#58a6ff" stroke-width="1.8"/>
    <text x="550" y="840" fill="#e6edf3" text-anchor="middle" font-size="10">Remote Session</text>
    <text x="550" y="854" fill="#e6edf3" text-anchor="middle" font-size="10">Confirmed?</text>
    <!-- YES branch -->
    <line x1="670" y1="844" x2="800" y2="844" stroke="#f85149" stroke-width="1.6" marker-end="url(#arrow13g)"/>
    <text x="716" y="837" fill="#f85149" font-size="10.5">YES</text>
    <rect x="802" y="818" width="140" height="52" rx="8" fill="#1a1214" stroke="#f85149" stroke-width="2"/>
    <text x="872" y="850" fill="#f85149" text-anchor="middle" font-weight="700" font-size="11">ESCALATE</text>
    <text x="595" y="889" fill="#8b949e" font-size="10">NO</text>
    <line x1="550" y1="894" x2="550" y2="924" stroke="#4b5563" stroke-width="1.8" marker-end="url(#arrow13g)"/>

    <!-- Q6 Supporting Malicious Evidence? -->
    <polygon points="550,926 680,980 550,1034 420,980" fill="#0d1421" stroke="#58a6ff" stroke-width="1.8"/>
    <text x="550" y="976" fill="#e6edf3" text-anchor="middle" font-size="10">Supporting</text>
    <text x="550" y="990" fill="#e6edf3" text-anchor="middle" font-size="10">Evidence?</text>
    <!-- YES branch -->
    <line x1="680" y1="980" x2="810" y2="980" stroke="#f85149" stroke-width="1.6" marker-end="url(#arrow13g)"/>
    <text x="726" y="973" fill="#f85149" font-size="10.5">YES</text>
    <rect x="812" y="954" width="140" height="52" rx="8" fill="#1a1214" stroke="#f85149" stroke-width="2"/>
    <text x="882" y="986" fill="#f85149" text-anchor="middle" font-weight="700" font-size="11">ESCALATE</text>
    <text x="595" y="1025" fill="#8b949e" font-size="10">NO</text>
    <line x1="550" y1="1034" x2="550" y2="1066" stroke="#4b5563" stroke-width="1.8" marker-end="url(#arrow13g)"/>

    <!-- Final: VALIDATION REQUIRED (state prior to authorization validation) -->
    <rect x="360" y="1068" width="380" height="80" rx="10" fill="#0d1421" stroke="#e6edf3" stroke-width="2" stroke-dasharray="5 3"/>
    <text x="550" y="1100" fill="#e6edf3" text-anchor="middle" font-weight="700" font-size="14">BLOCKED ACTIVITY</text>
    <text x="550" y="1124" fill="#d29922" text-anchor="middle" font-weight="700" font-size="12">VALIDATION REQUIRED</text>
    <text x="550" y="1160" fill="#6b7280" font-size="9.5" font-style="italic" text-anchor="middle">estado antes da validação de autorização</text>
  </g>

  <rect x="40" y="455" width="270" height="34" rx="6" fill="none" stroke="#3fb950" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="175" y="478" font-family="Segoe UI,Arial,sans-serif" font-size="9.5" fill="#3fb950" text-anchor="middle" font-style="italic">outcome real deste case</text>

  <text x="550" y="1210" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#8b949e" text-anchor="middle">não criar caminho direto "AnyDesk → Compromised"</text>
  <text x="550" y="1234" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">bloqueio confirma ação defensiva — não estado completo do endpoint</text>
</svg>
