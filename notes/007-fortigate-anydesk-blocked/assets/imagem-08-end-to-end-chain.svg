<svg viewBox="0 0 1400 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow08g" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#4b5563"/>
    </marker>
  </defs>
  <rect width="1400" height="800" fill="#0a0e14"/>
  <text x="700" y="50" font-family="Consolas,monospace" font-size="15" fill="#8b949e" text-anchor="middle" letter-spacing="3">END-TO-END INVESTIGATION CHAIN</text>
  <line x1="560" y1="66" x2="840" y2="66" stroke="#21262d" stroke-width="1"/>

  <!-- Zone 1: DEVICE h=70 top=395 -->
  <g transform="translate(20,395)">
    <rect width="175" height="70" rx="8" fill="#0d1421" stroke="#8b949e" stroke-width="1.6"/>
    <text x="87" y="24" font-family="Consolas,monospace" font-size="11" fill="#8b949e" text-anchor="middle" font-weight="700" letter-spacing="1">DEVICE</text>
    <line x1="0" y1="36" x2="175" y2="36" stroke="#21262d"/>
    <text x="87" y="58" font-family="Consolas,monospace" font-size="10.5" fill="#e6edf3" text-anchor="middle">Internal Endpoint</text>
  </g>
  <line x1="197" y1="430" x2="213" y2="430" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow08g)"/>

  <!-- Zone 2: NETWORK h=70 top=395 -->
  <g transform="translate(215,395)">
    <rect width="175" height="70" rx="8" fill="#0d1421" stroke="#56c2d4" stroke-width="1.6"/>
    <text x="87" y="24" font-family="Consolas,monospace" font-size="11" fill="#56c2d4" text-anchor="middle" font-weight="700" letter-spacing="1">NETWORK</text>
    <line x1="0" y1="36" x2="175" y2="36" stroke="#21262d"/>
    <text x="87" y="58" font-family="Consolas,monospace" font-size="10" fill="#e6edf3" text-anchor="middle">Outbound Comm.</text>
  </g>
  <line x1="392" y1="430" x2="408" y2="430" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow08g)"/>

  <!-- Zone 3: CONTROL h=110 top=375 -->
  <g transform="translate(410,375)">
    <rect width="175" height="110" rx="8" fill="#0d1421" stroke="#f0883e" stroke-width="1.8"/>
    <text x="87" y="24" font-family="Consolas,monospace" font-size="11" fill="#f0883e" text-anchor="middle" font-weight="700" letter-spacing="1">CONTROL</text>
    <line x1="0" y1="36" x2="175" y2="36" stroke="#21262d"/>
    <text x="87" y="56" font-family="Consolas,monospace" font-size="10" fill="#e6edf3" text-anchor="middle">FortiGate</text>
    <text x="87" y="72" font-family="Consolas,monospace" font-size="10" fill="#e6edf3" text-anchor="middle">AnyDesk</text>
    <text x="87" y="90" font-family="Consolas,monospace" font-size="10.5" fill="#f85149" text-anchor="middle" font-weight="700">BLOCK</text>
  </g>
  <line x1="587" y1="430" x2="603" y2="430" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow08g)"/>

  <!-- Zone 4: DETECTION h=70 top=395 -->
  <g transform="translate(605,395)">
    <rect width="175" height="70" rx="8" fill="#0d1421" stroke="#d29922" stroke-width="1.6"/>
    <text x="87" y="24" font-family="Consolas,monospace" font-size="11" fill="#d29922" text-anchor="middle" font-weight="700" letter-spacing="1">DETECTION</text>
    <line x1="0" y1="36" x2="175" y2="36" stroke="#21262d"/>
    <text x="87" y="58" font-family="Consolas,monospace" font-size="10.5" fill="#e6edf3" text-anchor="middle">Security Log / Wazuh</text>
  </g>
  <line x1="782" y1="430" x2="798" y2="430" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow08g)"/>

  <!-- Zone 5: ANALYSIS h=130 top=365 -->
  <g transform="translate(800,365)">
    <rect width="175" height="130" rx="8" fill="#0d1421" stroke="#bc8cff" stroke-width="1.6"/>
    <text x="87" y="24" font-family="Consolas,monospace" font-size="11" fill="#bc8cff" text-anchor="middle" font-weight="700" letter-spacing="1">ANALYSIS</text>
    <line x1="0" y1="36" x2="175" y2="36" stroke="#21262d"/>
    <text x="87" y="56" font-family="Consolas,monospace" font-size="9.5" fill="#e6edf3" text-anchor="middle">Hypothesis</text>
    <text x="87" y="72" font-family="Consolas,monospace" font-size="9.5" fill="#e6edf3" text-anchor="middle">Hunting</text>
    <text x="87" y="88" font-family="Consolas,monospace" font-size="9.5" fill="#e6edf3" text-anchor="middle">Recurrence</text>
    <text x="87" y="104" font-family="Consolas,monospace" font-size="9.5" fill="#e6edf3" text-anchor="middle">Evidence Assessment</text>
  </g>
  <line x1="977" y1="430" x2="993" y2="430" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow08g)"/>

  <!-- Zone 6: EVIDENCE h=170 top=345 -->
  <g transform="translate(995,345)">
    <rect width="175" height="170" rx="8" fill="#1a1608" stroke="#d29922" stroke-width="1.8" stroke-dasharray="5 4"/>
    <text x="87" y="24" font-family="Consolas,monospace" font-size="11" fill="#d29922" text-anchor="middle" font-weight="700" letter-spacing="1">EVIDENCE</text>
    <line x1="0" y1="36" x2="175" y2="36" stroke="#3a2f10"/>
    <text x="87" y="52" font-family="Consolas,monospace" font-size="8" fill="#e6edf3" text-anchor="middle">Process = NOT</text>
    <text x="87" y="64" font-family="Consolas,monospace" font-size="8" fill="#e6edf3" text-anchor="middle">AVAILABLE</text>
    <text x="87" y="80" font-family="Consolas,monospace" font-size="8" fill="#e6edf3" text-anchor="middle">User = NOT</text>
    <text x="87" y="92" font-family="Consolas,monospace" font-size="8" fill="#e6edf3" text-anchor="middle">AVAILABLE</text>
    <text x="87" y="108" font-family="Consolas,monospace" font-size="8" fill="#e6edf3" text-anchor="middle">Authorization = NOT</text>
    <text x="87" y="120" font-family="Consolas,monospace" font-size="8" fill="#e6edf3" text-anchor="middle">CONFIRMED</text>
    <text x="87" y="136" font-family="Consolas,monospace" font-size="8" fill="#e6edf3" text-anchor="middle">Session = NOT</text>
    <text x="87" y="148" font-family="Consolas,monospace" font-size="8" fill="#e6edf3" text-anchor="middle">CONFIRMED</text>
  </g>
  <line x1="1172" y1="430" x2="1188" y2="430" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow08g)"/>

  <!-- Zone 7: DECISION h=110 top=375 -->
  <g transform="translate(1190,375)">
    <rect width="190" height="110" rx="8" fill="#0f1f14" stroke="#3fb950" stroke-width="2.4"/>
    <text x="95" y="24" font-family="Consolas,monospace" font-size="11" fill="#3fb950" text-anchor="middle" font-weight="700" letter-spacing="1">DECISION</text>
    <line x1="0" y1="36" x2="190" y2="36" stroke="#1f3a24"/>
    <text x="95" y="56" font-family="Consolas,monospace" font-size="9.5" fill="#8b949e" text-anchor="middle">Unauthorized (org.</text>
    <text x="95" y="68" font-family="Consolas,monospace" font-size="9.5" fill="#8b949e" text-anchor="middle">validation)</text>
    <text x="95" y="88" font-family="Consolas,monospace" font-size="10.5" fill="#3fb950" text-anchor="middle" font-weight="700">Contenção</text>
    <text x="95" y="102" font-family="Consolas,monospace" font-size="10.5" fill="#3fb950" text-anchor="middle" font-weight="700">Preventiva</text>
  </g>

  <text x="700" y="590" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#8b949e" text-anchor="middle">dispositivo → rede → controle → detecção → análise → evidência → decisão</text>
  <text x="700" y="616" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">sem transformar hipótese em comprometimento</text>
</svg>
