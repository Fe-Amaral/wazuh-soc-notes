    <text x="0" y="106" font-family="Segoe UI,Arial,sans-serif" font-size="10.5" fill="#c9d1d9" text-anchor="middle" font-weight="600">Preventive</text>
    <text x="0" y="122" font-family="Segoe UI,Arial,sans-serif" font-size="10.5" fill="#c9d1d9" text-anchor="middle" font-weight="600">Containment</text>
