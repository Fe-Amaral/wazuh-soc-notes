    <rect x="-95" y="52" width="190" height="86" rx="8" fill="#0d1421" stroke="#2d3748" stroke-width="1.3"/>
    <text x="0" y="82" font-family="Consolas,monospace" font-size="14" fill="#e6edf3" text-anchor="middle" font-weight="700">CONTAINMENT</text>
    <text x="0" y="104" font-family="Segoe UI,Arial,sans-serif" font-size="10.5" fill="#8b949e" text-anchor="middle">Quarantine</text>
    <text x="0" y="120" font-family="Segoe UI,Arial,sans-serif" font-size="10.5" fill="#8b949e" text-anchor="middle">Device</text>
  </g>

