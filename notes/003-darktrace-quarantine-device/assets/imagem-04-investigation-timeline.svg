<svg viewBox="0 0 1200 480" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="480" fill="#0a0e14"/>
  <text x="600" y="46" font-family="Consolas,monospace" font-size="15" fill="#8b949e" text-anchor="middle" letter-spacing="3">INVESTIGATION TIMELINE</text>
  <line x1="480" y1="62" x2="720" y2="62" stroke="#21262d" stroke-width="1"/>

  <line x1="100" y1="200" x2="1100" y2="200" stroke="#21262d" stroke-width="3"/>
  <line x1="100" y1="200" x2="1100" y2="200" stroke="#3fb950" stroke-width="3" stroke-dasharray="2 8"/>

  <!-- Stage 1 -->
  <g transform="translate(150,200)">
    <circle r="28" fill="#0d1421" stroke="#58a6ff" stroke-width="2.5"/>
