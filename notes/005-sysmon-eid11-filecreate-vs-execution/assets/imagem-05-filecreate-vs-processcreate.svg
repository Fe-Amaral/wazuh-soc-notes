<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow05e" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#4b5563"/>
    </marker>
  </defs>
  <rect width="1200" height="600" fill="#0a0e14"/>
  <text x="600" y="50" font-family="Consolas,monospace" font-size="15" fill="#8b949e" text-anchor="middle" letter-spacing="3">FILECREATE VS PROCESSCREATE</text>
  <line x1="470" y1="66" x2="730" y2="66" stroke="#21262d" stroke-width="1"/>

  <!-- Left: EVENT ID 11 -->
  <g>
    <rect x="60" y="100" width="500" height="400" rx="10" fill="#0f1f14" stroke="#3fb950" stroke-width="1.8"/>
    <text x="310" y="140" font-family="Consolas,monospace" font-size="14" fill="#3fb950" text-anchor="middle" font-weight="700" letter-spacing="1">EVENT ID 11</text>
    <line x1="90" y1="158" x2="530" y2="158" stroke="#1f3a24"/>

    <rect x="180" y="190" width="260" height="52" rx="8" fill="#111827" stroke="#8b949e" stroke-width="1.6"/>
    <text x="310" y="216" font-family="Consolas,monospace" font-size="10.5" fill="#8b949e" text-anchor="middle">PROCESS</text>
    <text x="310" y="234" font-family="Consolas,monospace" font-size="13" fill="#e6edf3" text-anchor="middle">taskhostw.exe</text>
    <text x="500" y="266" font-family="Segoe UI,Arial,sans-serif" font-size="10.5" fill="#8b949e" text-anchor="middle">creates</text>
    <line x1="310" y1="242" x2="310" y2="284" stroke="#3fb950" stroke-width="2" marker-end="url(#arrow05e)"/>

    <rect x="180" y="286" width="260" height="52" rx="8" fill="#111827" stroke="#f0883e" stroke-width="1.6"/>
    <text x="310" y="308" font-family="Consolas,monospace" font-size="10.5" fill="#f0883e" text-anchor="middle">FILE</text>
    <text x="310" y="326" font-family="Consolas,monospace" font-size="13" fill="#f0883e" text-anchor="middle">CL_Utility.ps1</text>
    <line x1="310" y1="338" x2="310" y2="378" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow05e)"/>

    <rect x="160" y="380" width="300" height="60" rx="8" fill="#0f1f14" stroke="#3fb950" stroke-width="2"/>
    <text x="310" y="416" font-family="Consolas,monospace" font-size="13.5" fill="#3fb950" text-anchor="middle" font-weight="700">FILECREATE CONFIRMED</text>
  </g>

  <!-- Right: EXECUTION HYPOTHESIS -->
  <g>
    <rect x="640" y="100" width="500" height="400" rx="10" fill="#1a1214" stroke="#f85149" stroke-width="1.8"/>
    <text x="890" y="140" font-family="Consolas,monospace" font-size="14" fill="#f85149" text-anchor="middle" font-weight="700" letter-spacing="1">EXECUTION HYPOTHESIS</text>
    <line x1="670" y1="158" x2="1110" y2="158" stroke="#3a1f1f"/>

    <rect x="760" y="190" width="260" height="52" rx="8" fill="#111827" stroke="#8b949e" stroke-width="1.6"/>
    <text x="890" y="222" font-family="Consolas,monospace" font-size="13" fill="#e6edf3" text-anchor="middle">powershell.exe</text>
    <text x="1080" y="266" font-family="Segoe UI,Arial,sans-serif" font-size="10.5" fill="#d29922" text-anchor="middle">executes?</text>
    <line x1="890" y1="242" x2="890" y2="284" stroke="#d29922" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow05e)"/>

    <rect x="760" y="286" width="260" height="52" rx="8" fill="#111827" stroke="#f0883e" stroke-width="1.6"/>
    <text x="890" y="318" font-family="Consolas,monospace" font-size="13" fill="#f0883e" text-anchor="middle">CL_Utility.ps1</text>
    <line x1="890" y1="338" x2="890" y2="378" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow05e)"/>

    <rect x="740" y="380" width="300" height="60" rx="8" fill="#1a1214" stroke="#f85149" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="890" y="416" font-family="Consolas,monospace" font-size="14" fill="#f85149" text-anchor="middle" font-weight="700">NOT CONFIRMED</text>
  </g>

  <rect x="350" y="520" width="500" height="46" rx="8" fill="#0d1421" stroke="#58a6ff" stroke-width="1.8"/>
  <text x="600" y="548" font-family="Consolas,monospace" font-size="14.5" fill="#58a6ff" text-anchor="middle" font-weight="700">FILE CREATION  ≠  SCRIPT EXECUTION</text>
</svg>
