    <line x1="450" y1="364" x2="450" y2="398" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow02e)"/>

    <rect x="330" y="400" width="240" height="64" rx="8" fill="#0d1421" stroke="#bc8cff" stroke-width="1.8" stroke-dasharray="6 4"/>
