<svg viewBox="0 0 1300 480" xmlns="http://www.w3.org/2000/svg">
  <rect width="1300" height="480" fill="#0a0e14"/>
  <text x="650" y="50" font-family="Consolas,monospace" font-size="15" fill="#8b949e" text-anchor="middle" letter-spacing="3">INVESTIGATION TIMELINE</text>
  <line x1="530" y1="66" x2="770" y2="66" stroke="#21262d" stroke-width="1"/>

  <line x1="110" y1="220" x2="1190" y2="220" stroke="#21262d" stroke-width="2"/>

  <!-- 6 stages -->
  <g>
    <circle cx="110" cy="220" r="14" fill="#0d1421" stroke="#f0883e" stroke-width="2.5"/>
    <text x="110" y="180" font-family="Consolas,monospace" font-size="12.5" fill="#f0883e" text-anchor="middle" font-weight="700">DETECTION</text>
    <text x="110" y="260" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">EID 11 / File Created</text>
  </g>
  <g>
    <circle cx="326" cy="220" r="14" fill="#0d1421" stroke="#d29922" stroke-width="2.5"/>
    <text x="326" y="180" font-family="Consolas,monospace" font-size="12.5" fill="#d29922" text-anchor="middle" font-weight="700">HYPOTHESIS</text>
    <text x="326" y="260" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">possible PowerShell activity</text>
  </g>
  <g>
    <circle cx="542" cy="220" r="14" fill="#0d1421" stroke="#58a6ff" stroke-width="2.5"/>
    <text x="542" y="180" font-family="Consolas,monospace" font-size="11.5" fill="#58a6ff" text-anchor="middle" font-weight="700">PROCESS ANALYSIS</text>
    <text x="542" y="260" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">taskhostw.exe / System32</text>
  </g>
  <g>
    <circle cx="758" cy="220" r="14" fill="#0d1421" stroke="#bc8cff" stroke-width="2.5"/>
    <text x="758" y="180" font-family="Consolas,monospace" font-size="13" fill="#bc8cff" text-anchor="middle" font-weight="700">HUNTING</text>
    <text x="758" y="260" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">execution / network / persistence</text>
  </g>
  <g>
    <circle cx="974" cy="220" r="14" fill="#0d1421" stroke="#56c2d4" stroke-width="2.5"/>
    <text x="974" y="180" font-family="Consolas,monospace" font-size="13" fill="#56c2d4" text-anchor="middle" font-weight="700">CONTEXT</text>
    <text x="974" y="260" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">diagnostic-like pattern</text>
  </g>
  <g>
    <circle cx="1190" cy="220" r="16" fill="#0f1f14" stroke="#3fb950" stroke-width="3"/>
    <text x="1190" y="180" font-family="Consolas,monospace" font-size="12.5" fill="#3fb950" text-anchor="middle" font-weight="700">DECISION</text>
    <text x="1190" y="260" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">verdict</text>
  </g>

  <!-- Callout: Execution Not Confirmed -->
  <line x1="758" y1="234" x2="758" y2="300" stroke="#d29922" stroke-width="1.4" stroke-dasharray="4 3"/>
  <rect x="600" y="304" width="316" height="56" rx="6" fill="#1a1608" stroke="#d29922" stroke-width="1.6"/>
  <text x="758" y="328" font-family="Consolas,monospace" font-size="12.5" fill="#d29922" text-anchor="middle" font-weight="700">Execution Not Confirmed</text>
  <text x="758" y="347" font-family="Segoe UI,Arial,sans-serif" font-size="10.5" fill="#8b949e" text-anchor="middle">apesar da busca ativa</text>

  <rect x="440" y="400" width="420" height="52" rx="6" fill="none" stroke="#21262d" stroke-width="1"/>
  <text x="650" y="433" font-family="Consolas,monospace" font-size="15" fill="#7ee787" text-anchor="middle" font-weight="700">FALSE POSITIVE</text>
</svg>
