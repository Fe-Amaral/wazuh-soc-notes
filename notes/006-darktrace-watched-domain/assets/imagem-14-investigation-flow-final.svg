<svg viewBox="0 0 1600 460" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="460" fill="#0a0e14"/>
  <text x="800" y="46" font-family="Consolas,monospace" font-size="15" fill="#8b949e" text-anchor="middle" letter-spacing="3">INVESTIGATION FLOW — FINAL</text>
  <line x1="670" y1="62" x2="930" y2="62" stroke="#21262d" stroke-width="1"/>

  <g font-family="Consolas,monospace" font-weight="700">

    <!-- 1 DETECTION -->
    <polygon points="40,150 206,150 230,195 206,240 40,240" fill="#0d1421" stroke="#f0883e" stroke-width="1.8"/>
    <text x="115" y="180" font-size="12" fill="#f0883e" text-anchor="middle">DETECTION</text>
    <text x="115" y="202" font-size="9" font-weight="400" fill="#8b949e" text-anchor="middle">Watched</text>
    <text x="115" y="216" font-size="9" font-weight="400" fill="#8b949e" text-anchor="middle">Domain</text>

    <!-- 2 SEVERITY -->
    <polygon points="230,150 396,150 420,195 396,240 230,240 206,195" fill="#0d1421" stroke="#f85149" stroke-width="1.8"/>
    <text x="313" y="180" font-size="12" fill="#f85149" text-anchor="middle">SEVERITY</text>
    <text x="313" y="202" font-size="9" font-weight="400" fill="#8b949e" text-anchor="middle">Critical /</text>
    <text x="313" y="216" font-size="9" font-weight="400" fill="#8b949e" text-anchor="middle">Score 100</text>

    <!-- 3 HYPOTHESIS -->
    <polygon points="420,150 586,150 610,195 586,240 420,240 396,195" fill="#0d1421" stroke="#d29922" stroke-width="1.8"/>
    <text x="503" y="180" font-size="11" fill="#d29922" text-anchor="middle">HYPOTHESIS</text>
    <text x="503" y="202" font-size="8.5" font-weight="400" fill="#8b949e" text-anchor="middle">Possible Suspicious</text>
    <text x="503" y="216" font-size="8.5" font-weight="400" fill="#8b949e" text-anchor="middle">Communication</text>

    <!-- 4 HUNTING -->
    <polygon points="610,150 776,150 800,195 776,240 610,240 586,195" fill="#0d1421" stroke="#bc8cff" stroke-width="1.8"/>
    <text x="693" y="180" font-size="12" fill="#bc8cff" text-anchor="middle">HUNTING</text>
    <text x="693" y="202" font-size="8.5" font-weight="400" fill="#8b949e" text-anchor="middle">Protocol + Dest.</text>
    <text x="693" y="216" font-size="8.5" font-weight="400" fill="#8b949e" text-anchor="middle">+ Device</text>

    <!-- 5 CONTEXT -->
    <polygon points="800,150 966,150 990,195 966,240 800,240 776,195" fill="#0d1421" stroke="#56c2d4" stroke-width="1.8"/>
    <text x="883" y="180" font-size="12.5" fill="#56c2d4" text-anchor="middle">CONTEXT</text>
    <text x="883" y="202" font-size="8.5" font-weight="400" fill="#8b949e" text-anchor="middle">DNS / Internal</text>
    <text x="883" y="216" font-size="8.5" font-weight="400" fill="#8b949e" text-anchor="middle">Resolver</text>

    <!-- 6 EVIDENCE -->
    <polygon points="990,150 1156,150 1180,195 1156,240 990,240 966,195" fill="#0d1421" stroke="#58a6ff" stroke-width="1.8"/>
    <text x="1073" y="174" font-size="12" fill="#58a6ff" text-anchor="middle">EVIDENCE</text>
    <text x="1073" y="194" font-size="7.6" font-weight="400" fill="#8b949e" text-anchor="middle">Follow-up Activity</text>
    <text x="1073" y="206" font-size="7.6" font-weight="400" fill="#8b949e" text-anchor="middle">Not Available</text>
    <text x="1073" y="220" font-size="7.6" font-weight="400" fill="#8b949e" text-anchor="middle">Compromise Not</text>
    <text x="1073" y="231" font-size="7.6" font-weight="400" fill="#8b949e" text-anchor="middle">Confirmed</text>

    <!-- 7 IMPACT -->
    <polygon points="1180,150 1346,150 1370,195 1346,240 1180,240 1156,195" fill="#1a1608" stroke="#d29922" stroke-width="1.8" stroke-dasharray="5 4"/>
    <text x="1263" y="180" font-size="12" fill="#d29922" text-anchor="middle">IMPACT</text>
    <text x="1263" y="202" font-size="8" font-weight="400" fill="#8b949e" text-anchor="middle">Not Confirmed</text>
    <text x="1263" y="214" font-size="8" font-weight="400" fill="#8b949e" text-anchor="middle">(technical)</text>

    <!-- 8 DECISION -->
    <polygon points="1370,150 1560,150 1560,240 1370,240 1346,195" fill="#0f1f14" stroke="#3fb950" stroke-width="2.4"/>
    <text x="1465" y="176" font-size="13" fill="#3fb950" text-anchor="middle">DECISION</text>
    <text x="1465" y="196" font-size="8.5" font-weight="400" fill="#8b949e" text-anchor="middle">User-Acknowledged</text>
    <text x="1465" y="209" font-size="8.5" font-weight="400" fill="#8b949e" text-anchor="middle">Access</text>
    <text x="1465" y="224" font-size="10" font-weight="700" fill="#3fb950" text-anchor="middle">False Positive</text>
  </g>

  <rect x="440" y="290" width="720" height="56" rx="8" fill="#0d1421" stroke="#e6edf3" stroke-width="1.4"/>
  <text x="800" y="315" font-family="Consolas,monospace" font-size="15" fill="#e6edf3" text-anchor="middle" font-weight="700">SEVERITY  ≠  IMPACT</text>
  <text x="800" y="335" font-family="Consolas,monospace" font-size="10.5" fill="#d29922" text-anchor="middle">SCORE  ≠  COMPROMISE PROBABILITY</text>

  <text x="800" y="400" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#8b949e" text-anchor="middle">a principal lição metodológica do #006, consolidada ponta a ponta</text>
  <text x="800" y="424" font-family="Segoe UI,Arial,sans-serif" font-size="11.5" fill="#6b7280" text-anchor="middle">fechado por reconhecimento do usuário — não por telemetria técnica adicional</text>
</svg>
