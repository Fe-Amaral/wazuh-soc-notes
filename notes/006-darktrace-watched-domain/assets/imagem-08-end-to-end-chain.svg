  <text x="700" y="590" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#8b949e" text-anchor="middle">dispositivo → rede → detecção → alerta → análise → evidência → decisão</text>
  <text x="700" y="616" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">a diferença entre severidade, evidência e veredito</text>
</svg>
