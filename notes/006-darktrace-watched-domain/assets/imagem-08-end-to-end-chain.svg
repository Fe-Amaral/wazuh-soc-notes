    <text x="87" y="58" font-family="Consolas,monospace" font-size="9.5" fill="#e6edf3" text-anchor="middle">Protocol + Destination</text>
    <text x="87" y="76" font-family="Consolas,monospace" font-size="9.5" fill="#e6edf3" text-anchor="middle">+ Hunting</text>
