  </defs>
  <rect width="1400" height="800" fill="#0a0e14"/>
  <text x="700" y="50" font-family="Consolas,monospace" font-size="15" fill="#8b949e" text-anchor="middle" letter-spacing="3">END-TO-END INVESTIGATION CHAIN</text>
  <line x1="560" y1="66" x2="840" y2="66" stroke="#21262d" stroke-width="1"/>

  <!-- Zone 1: DEVICE h=70 top=395 -->
