    <text x="87" y="58" font-family="Consolas,monospace" font-size="10.5" fill="#e6edf3" text-anchor="middle">Watched Domain</text>
    <text x="87" y="76" font-family="Consolas,monospace" font-size="10.5" fill="#e6edf3" text-anchor="middle">Score 100</text>
  </g>
  <line x1="587" y1="430" x2="603" y2="430" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow08f)"/>

