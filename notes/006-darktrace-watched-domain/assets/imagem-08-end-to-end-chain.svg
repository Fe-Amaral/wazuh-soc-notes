    <text x="87" y="58" font-family="Consolas,monospace" font-size="11" fill="#e6edf3" text-anchor="middle">Mobile / Android</text>
  </g>
  <line x1="197" y1="430" x2="213" y2="430" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow08f)"/>

