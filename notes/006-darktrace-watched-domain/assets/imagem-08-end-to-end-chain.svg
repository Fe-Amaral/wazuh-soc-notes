    <text x="87" y="106" font-family="Consolas,monospace" font-size="9" fill="#e6edf3" text-anchor="middle">Compromise Not</text>
    <text x="87" y="120" font-family="Consolas,monospace" font-size="9" fill="#e6edf3" text-anchor="middle">Confirmed</text>
