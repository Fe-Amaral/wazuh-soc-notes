<svg viewBox="0 0 1200 820" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="820" fill="#0a0e14"/>
  <text x="600" y="50" font-family="Consolas,monospace" font-size="15" fill="#8b949e" text-anchor="middle" letter-spacing="3">EVIDENCE ASSESSMENT</text>
  <line x1="500" y1="66" x2="700" y2="66" stroke="#21262d" stroke-width="1"/>

  <!-- Quadrant 1: CONFIRMED -->
  <g>
    <rect x="60" y="100" width="530" height="270" rx="10" fill="#0f1f14" stroke="#3fb950" stroke-width="1.8"/>
    <text x="325" y="134" font-family="Consolas,monospace" font-size="14" fill="#3fb950" text-anchor="middle" font-weight="700" letter-spacing="1">CONFIRMED</text>
    <line x1="90" y1="150" x2="560" y2="150" stroke="#1f3a24"/>
    <g font-family="Consolas,monospace" font-size="13.5" fill="#e6edf3">
      <circle cx="105" cy="184" r="4" fill="#3fb950"/><text x="122" y="189">mmc.exe</text>
      <circle cx="105" cy="220" r="4" fill="#3fb950"/><text x="122" y="225">System32 path</text>
      <circle cx="105" cy="256" r="4" fill="#3fb950"/><text x="122" y="261">TCP connection</text>
      <circle cx="330" cy="184" r="4" fill="#3fb950"/><text x="347" y="189">::1 → ::1</text>
      <circle cx="330" cy="220" r="4" fill="#3fb950"/><text x="347" y="225">Destination Port 135</text>
    </g>
  </g>

  <!-- Quadrant 2: SUPPORTED -->
  <g>
    <rect x="610" y="100" width="530" height="270" rx="10" fill="#0d1421" stroke="#58a6ff" stroke-width="1.8"/>
    <text x="875" y="134" font-family="Consolas,monospace" font-size="14" fill="#58a6ff" text-anchor="middle" font-weight="700" letter-spacing="1">SUPPORTED</text>
    <line x1="640" y1="150" x2="1110" y2="150" stroke="#1c2b40"/>
    <rect x="690" y="184" width="400" height="70" rx="8" fill="#111827" stroke="#58a6ff" stroke-width="1.4"/>
    <text x="890" y="215" font-family="Consolas,monospace" font-size="12.5" fill="#e6edf3" text-anchor="middle">Local Loopback Context</text>
    <text x="890" y="238" font-family="Consolas,monospace" font-size="12.5" fill="#58a6ff" text-anchor="middle" font-weight="700">RPC Endpoint Mapper Context</text>
    <text x="875" y="300" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">interpretação técnica sustentada pela</text>
    <text x="875" y="320" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">tupla de rede confirmada</text>
  </g>

  <!-- Quadrant 3: NOT AVAILABLE -->
  <g>
    <rect x="60" y="390" width="530" height="270" rx="10" fill="#15161a" stroke="#8b949e" stroke-width="1.8" stroke-dasharray="5 4"/>
    <text x="325" y="424" font-family="Consolas,monospace" font-size="14" fill="#8b949e" text-anchor="middle" font-weight="700" letter-spacing="1">NOT AVAILABLE</text>
    <line x1="90" y1="440" x2="560" y2="440" stroke="#2a2d33"/>
    <g font-family="Consolas,monospace" font-size="13.5" fill="#8b949e">
      <circle cx="105" cy="474" r="4" fill="#8b949e"/><text x="122" y="479">Command Line</text>
      <circle cx="105" cy="508" r="4" fill="#8b949e"/><text x="122" y="513">Parent Process</text>
      <circle cx="105" cy="542" r="4" fill="#8b949e"/><text x="122" y="547">MMC Snap-in</text>
      <circle cx="105" cy="576" r="4" fill="#8b949e"/><text x="122" y="581">Full Process Lineage</text>
    </g>
    <text x="325" y="630" font-family="Segoe UI,Arial,sans-serif" font-size="11.5" fill="#6b7280" text-anchor="middle">telemetria de processo não existia na evidência original</text>
  </g>

  <!-- Quadrant 4: NOT CONFIRMED -->
  <g>
    <rect x="610" y="390" width="530" height="270" rx="10" fill="#1a1608" stroke="#d29922" stroke-width="1.8"/>
    <text x="875" y="424" font-family="Consolas,monospace" font-size="14" fill="#d29922" text-anchor="middle" font-weight="700" letter-spacing="1">NOT CONFIRMED</text>
    <line x1="640" y1="440" x2="1110" y2="440" stroke="#3a2f10"/>
    <g font-family="Consolas,monospace" font-size="13" fill="#e6edf3">
      <circle cx="625" cy="470" r="4" fill="#d29922"/><text x="642" y="475">SMB Session</text>
      <circle cx="625" cy="500" r="4" fill="#d29922"/><text x="642" y="505">Admin Share Access</text>
      <circle cx="625" cy="530" r="4" fill="#d29922"/><text x="642" y="535">Remote Authentication</text>
      <circle cx="625" cy="560" r="4" fill="#d29922"/><text x="642" y="565">Lateral Movement</text>
      <circle cx="625" cy="590" r="4" fill="#d29922"/><text x="642" y="595">Compromise</text>
    </g>
    <text x="875" y="632" font-family="Segoe UI,Arial,sans-serif" font-size="11.5" fill="#6b7280" text-anchor="middle">sinal relevante existe — evidência não fecha a conclusão</text>
  </g>

  <rect x="310" y="690" width="580" height="60" rx="8" fill="#0d1421" stroke="#f85149" stroke-width="1.8"/>
  <text x="600" y="726" font-family="Consolas,monospace" font-size="14.5" fill="#f85149" text-anchor="middle" font-weight="700">TCP/445  NOT OBSERVED  IN ANALYZED EVENT</text>

  <text x="600" y="785" font-family="Segoe UI,Arial,sans-serif" font-size="12.5" fill="#8b949e" text-anchor="middle">manter separados: ausência de telemetria, ausência observada e conclusão não confirmada</text>
</svg>
