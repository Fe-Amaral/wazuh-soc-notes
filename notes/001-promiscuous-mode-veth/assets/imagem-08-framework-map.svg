<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="700" fill="#0a0e14"/>
  <text x="600" y="50" font-family="Consolas,monospace" font-size="15" fill="#8b949e" text-anchor="middle" letter-spacing="3">FRAMEWORK APPLICABILITY MAP</text>
  <line x1="440" y1="66" x2="760" y2="66" stroke="#21262d" stroke-width="1"/>

  <!-- Tier 1 -->
  <g transform="translate(60,100)">
    <rect width="1080" height="150" rx="10" fill="#0f1f14" stroke="#3fb950" stroke-width="1.8"/>
    <rect width="10" height="150" fill="#3fb950"/>
    <text x="40" y="42" font-family="Consolas,monospace" font-size="16" fill="#3fb950" font-weight="700" letter-spacing="1">DIRECT / STRONG RELEVANCE</text>
    <text x="40" y="66" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#8b949e">frameworks diretamente aplicados na investigação e no veredito</text>

    <g font-family="Consolas,monospace" font-size="15" fill="#e6edf3">
      <rect x="40" y="90" width="220" height="44" rx="22" fill="#0a0e14" stroke="#3fb950" stroke-width="1.4"/>
      <text x="150" y="118" text-anchor="middle">MITRE ATT&amp;CK</text>
      <rect x="290" y="90" width="140" height="44" rx="22" fill="#0a0e14" stroke="#3fb950" stroke-width="1.4"/>
      <text x="360" y="118" text-anchor="middle">NIST</text>
    </g>
  </g>

  <!-- Tier 2 -->
  <g transform="translate(60,280)">
    <rect width="1080" height="130" rx="10" fill="#1a1608" stroke="#d29922" stroke-width="1.8"/>
    <rect width="10" height="130" fill="#d29922"/>
    <text x="40" y="42" font-family="Consolas,monospace" font-size="16" fill="#d29922" font-weight="700" letter-spacing="1">SUPPORTING / PARTIAL</text>
    <text x="40" y="66" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#8b949e">contribuem parcialmente para contexto ou estrutura do caso</text>

    <g font-family="Consolas,monospace" font-size="15" fill="#e6edf3">
      <rect x="40" y="86" width="200" height="40" rx="20" fill="#0a0e14" stroke="#d29922" stroke-width="1.4"/>
      <text x="140" y="112" text-anchor="middle">D3FEND</text>
      <rect x="270" y="86" width="160" height="40" rx="20" fill="#0a0e14" stroke="#d29922" stroke-width="1.4"/>
      <text x="350" y="112" text-anchor="middle">VERIS</text>
      <rect x="450" y="86" width="120" height="40" rx="20" fill="#0a0e14" stroke="#d29922" stroke-width="1.4"/>
      <text x="510" y="112" text-anchor="middle">CIS</text>
    </g>
  </g>

  <!-- Tier 3 -->
  <g transform="translate(60,440)">
    <rect width="1080" height="110" rx="10" fill="#131720" stroke="#4b5563" stroke-width="1.6"/>
    <rect width="10" height="110" fill="#4b5563"/>
    <text x="40" y="40" font-family="Consolas,monospace" font-size="16" fill="#9aa4b2" font-weight="700" letter-spacing="1">NOT APPLICABLE</text>
    <text x="40" y="62" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#6b7280">sem aderência técnica a este caso</text>

    <g font-family="Consolas,monospace" font-size="14" fill="#9aa4b2">
      <rect x="40" y="76" width="160" height="36" rx="18" fill="none" stroke="#4b5563" stroke-width="1.3" stroke-dasharray="3 3"/>
      <text x="120" y="99" text-anchor="middle">Engage</text>
      <rect x="220" y="76" width="300" height="36" rx="18" fill="none" stroke="#4b5563" stroke-width="1.3" stroke-dasharray="3 3"/>
      <text x="370" y="99" text-anchor="middle" font-size="13">Fight Fraud Framework</text>
    </g>
  </g>

  <text x="600" y="600" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#8b949e" text-anchor="middle">maturidade não é usar todos os frameworks — é saber quando cada um se aplica</text>
</svg>
