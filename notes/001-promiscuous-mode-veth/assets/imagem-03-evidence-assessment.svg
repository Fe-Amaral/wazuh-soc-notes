<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow03" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#3fb950"/>
    </marker>
  </defs>
  <rect width="1200" height="700" fill="#0a0e14"/>
  <text x="600" y="50" font-family="Consolas,monospace" font-size="15" fill="#8b949e" text-anchor="middle" letter-spacing="3">EVIDENCE ASSESSMENT</text>
  <line x1="440" y1="66" x2="760" y2="66" stroke="#21262d" stroke-width="1"/>

  <!-- LEFT: legitimate -->
  <g transform="translate(60,100)">
    <rect width="500" height="48" rx="6" fill="#0d1421" stroke="#3fb950" stroke-width="1.5"/>
    <text x="250" y="31" font-family="Consolas,monospace" font-size="15" fill="#3fb950" text-anchor="middle" font-weight="700" letter-spacing="1">SUPPORTS LEGITIMATE CONTEXT</text>

    <rect x="60" y="90" width="380" height="60" rx="8" fill="#0d1421" stroke="#2d3748" stroke-width="1.3"/>
    <text x="250" y="113" font-family="Consolas,monospace" font-size="14" fill="#e6edf3" text-anchor="middle">veth identified</text>
    <text x="250" y="133" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">interface confirmada como Ethernet virtual</text>
    <line x1="250" y1="150" x2="250" y2="185" stroke="#3fb950" stroke-width="2" marker-end="url(#arrow03)"/>

    <rect x="60" y="195" width="380" height="60" rx="8" fill="#0d1421" stroke="#2d3748" stroke-width="1.3"/>
    <text x="250" y="218" font-family="Consolas,monospace" font-size="14" fill="#e6edf3" text-anchor="middle">correlated events</text>
    <text x="250" y="238" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">ocorrências recorrentes em interfaces virtuais</text>
    <line x1="250" y1="255" x2="250" y2="290" stroke="#3fb950" stroke-width="2" marker-end="url(#arrow03)"/>

    <rect x="40" y="300" width="420" height="66" rx="8" fill="#0f1f14" stroke="#3fb950" stroke-width="1.8"/>
    <text x="250" y="326" font-family="Consolas,monospace" font-size="15" fill="#3fb950" text-anchor="middle" font-weight="700">virtual networking context</text>
    <text x="250" y="348" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">padrão coerente de infraestrutura</text>
  </g>

  <!-- divider -->
  <line x1="600" y1="100" x2="600" y2="640" stroke="#21262d" stroke-width="1"/>

  <!-- RIGHT: malicious supporting evidence -->
  <g transform="translate(640,100)">
    <rect width="500" height="48" rx="6" fill="#0d1421" stroke="#4b5563" stroke-width="1.5"/>
    <text x="250" y="31" font-family="Consolas,monospace" font-size="15" fill="#c9d1d9" text-anchor="middle" font-weight="700" letter-spacing="1">MALICIOUS SUPPORTING EVIDENCE</text>

    <g font-family="Consolas,monospace" font-size="14">
      <!-- rows -->
      <g transform="translate(0,80)">
        <text x="0" y="20" fill="#e6edf3">sniffing tool</text>
        <rect x="330" y="0" width="150" height="28" rx="14" fill="none" stroke="#6b7280" stroke-width="1.3"/>
        <text x="405" y="19" fill="#8b949e" text-anchor="middle" font-size="11">NOT OBSERVED</text>
      </g>
      <line x1="0" y1="98" x2="500" y2="98" stroke="#1c2129" stroke-width="1"/>
      <g transform="translate(0,116)">
        <text x="0" y="20" fill="#e6edf3">capture artifact (.pcap)</text>
        <rect x="330" y="0" width="150" height="28" rx="14" fill="none" stroke="#6b7280" stroke-width="1.3"/>
        <text x="405" y="19" fill="#8b949e" text-anchor="middle" font-size="11">NOT OBSERVED</text>
      </g>
      <line x1="0" y1="154" x2="500" y2="154" stroke="#1c2129" stroke-width="1"/>
      <g transform="translate(0,172)">
        <text x="0" y="20" fill="#e6edf3">suspicious process</text>
        <rect x="330" y="0" width="150" height="28" rx="14" fill="none" stroke="#6b7280" stroke-width="1.3"/>
        <text x="405" y="19" fill="#8b949e" text-anchor="middle" font-size="11">NOT OBSERVED</text>
      </g>
      <line x1="0" y1="210" x2="500" y2="210" stroke="#1c2129" stroke-width="1"/>
      <g transform="translate(0,228)">
        <text x="0" y="20" fill="#e6edf3">command and control</text>
        <rect x="330" y="0" width="150" height="28" rx="14" fill="none" stroke="#6b7280" stroke-width="1.3"/>
        <text x="405" y="19" fill="#8b949e" text-anchor="middle" font-size="11">NOT OBSERVED</text>
      </g>
      <line x1="0" y1="266" x2="500" y2="266" stroke="#1c2129" stroke-width="1"/>
      <g transform="translate(0,284)">
        <text x="0" y="20" fill="#e6edf3">exfiltration</text>
        <rect x="330" y="0" width="150" height="28" rx="14" fill="none" stroke="#6b7280" stroke-width="1.3"/>
        <text x="405" y="19" fill="#8b949e" text-anchor="middle" font-size="11">NOT OBSERVED</text>
      </g>
    </g>
  </g>

  <text x="600" y="670" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">ausência de evidência não é evidência de ausência — mas orienta a classificação</text>
</svg>
