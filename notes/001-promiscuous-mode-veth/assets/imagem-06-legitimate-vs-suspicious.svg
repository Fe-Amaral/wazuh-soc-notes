<svg viewBox="0 0 1200 780" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="780" fill="#0a0e14"/>
  <text x="600" y="46" font-family="Consolas,monospace" font-size="15" fill="#8b949e" text-anchor="middle" letter-spacing="3">LEGITIMATE VS SUSPICIOUS</text>
  <line x1="470" y1="62" x2="730" y2="62" stroke="#21262d" stroke-width="1"/>

  <!-- shared signal -->
  <rect x="420" y="90" width="360" height="64" rx="10" fill="#161616" stroke="#e6edf3" stroke-width="2"/>
  <text x="600" y="116" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#8b949e" text-anchor="middle" letter-spacing="1">SAME INITIAL SIGNAL</text>
  <text x="600" y="140" font-family="Consolas,monospace" font-size="17" fill="#e6edf3" text-anchor="middle" font-weight="700">PROMISCUOUS MODE</text>

  <line x1="480" y1="154" x2="290" y2="205" stroke="#4b5563" stroke-width="1.6"/>
  <line x1="720" y1="154" x2="910" y2="205" stroke="#4b5563" stroke-width="1.6"/>

  <!-- LEFT header -->
  <rect x="60" y="205" width="460" height="46" rx="8" fill="#0f1f14" stroke="#3fb950" stroke-width="1.8"/>
  <text x="290" y="234" font-family="Consolas,monospace" font-size="15" fill="#3fb950" text-anchor="middle" font-weight="700" letter-spacing="1">LEGITIMATE VIRTUAL NETWORKING</text>

  <!-- RIGHT header -->
  <rect x="680" y="205" width="460" height="46" rx="8" fill="#1f1212" stroke="#f85149" stroke-width="1.8"/>
  <text x="910" y="234" font-family="Consolas,monospace" font-size="15" fill="#f85149" text-anchor="middle" font-weight="700" letter-spacing="1">POTENTIAL NETWORK SNIFFING</text>

  <!-- left items -->
  <g font-family="Consolas,monospace" font-size="14" fill="#e6edf3">
    <g transform="translate(60,268)"><rect width="460" height="52" rx="7" fill="#0d1421" stroke="#2d3748"/><text x="24" y="32">veth interface</text></g>
    <g transform="translate(60,334)"><rect width="460" height="52" rx="7" fill="#0d1421" stroke="#2d3748"/><text x="24" y="32">virtual network</text></g>
    <g transform="translate(60,400)"><rect width="460" height="52" rx="7" fill="#0d1421" stroke="#2d3748"/><text x="24" y="32">correlated events</text></g>
    <g transform="translate(60,466)"><rect width="460" height="52" rx="7" fill="#0d1421" stroke="#2d3748"/><text x="24" y="32">expected infrastructure behavior</text></g>
    <g transform="translate(60,532)"><rect width="460" height="52" rx="7" fill="#0d1421" stroke="#2d3748"/><text x="24" y="32">no sniffing tool</text></g>
    <g transform="translate(60,598)"><rect width="460" height="52" rx="7" fill="#0f1f14" stroke="#3fb950" stroke-width="1.4"/><text x="24" y="32" fill="#3fb950">no capture artifact</text></g>
  </g>

  <!-- right items -->
  <g font-family="Consolas,monospace" font-size="14" fill="#e6edf3">
    <g transform="translate(680,268)"><rect width="460" height="52" rx="7" fill="#0d1421" stroke="#2d3748"/><text x="24" y="32">physical interface</text></g>
    <g transform="translate(680,334)"><rect width="460" height="52" rx="7" fill="#0d1421" stroke="#2d3748"/><text x="24" y="32">tcpdump / tshark / dumpcap</text></g>
    <g transform="translate(680,400)"><rect width="460" height="52" rx="7" fill="#0d1421" stroke="#2d3748"/><text x="24" y="32">unexpected privilege</text></g>
    <g transform="translate(680,466)"><rect width="460" height="52" rx="7" fill="#0d1421" stroke="#2d3748"/><text x="24" y="32">capture file</text></g>
    <g transform="translate(680,532)"><rect width="460" height="52" rx="7" fill="#0d1421" stroke="#2d3748"/><text x="24" y="32">suspicious process</text></g>
    <g transform="translate(680,598)"><rect width="460" height="52" rx="7" fill="#1f1212" stroke="#f85149" stroke-width="1.4"/><text x="24" y="32" fill="#f85149">additional malicious activity</text></g>
  </g>

  <text x="600" y="710" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#8b949e" text-anchor="middle">o mesmo indicador inicial pode levar a conclusões completamente diferentes — o contexto decide</text>
</svg>
