<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#0a0e14"/>
  <text x="600" y="50" font-family="Consolas,monospace" font-size="15" fill="#8b949e" text-anchor="middle" letter-spacing="3">EVIDENCE ASSESSMENT</text>
  <line x1="500" y1="66" x2="700" y2="66" stroke="#21262d" stroke-width="1"/>

  <!-- Quadrant 1: CONFIRMED -->
  <g>
    <rect x="60" y="100" width="530" height="270" rx="10" fill="#0f1f14" stroke="#3fb950" stroke-width="1.8"/>
    <text x="325" y="134" font-family="Consolas,monospace" font-size="14" fill="#3fb950" text-anchor="middle" font-weight="700" letter-spacing="1">CONFIRMED</text>
    <line x1="90" y1="150" x2="560" y2="150" stroke="#1f3a24"/>
    <g font-family="Consolas,monospace" font-size="13" fill="#e6edf3">
      <circle cx="105" cy="182" r="4" fill="#3fb950"/><text x="122" y="187">SPF / DKIM / DMARC PASS</text>
      <circle cx="105" cy="212" r="4" fill="#3fb950"/><text x="122" y="217">Composite Authentication PASS</text>
      <circle cx="105" cy="242" r="4" fill="#3fb950"/><text x="122" y="247">SMTP Chain Consistency</text>
      <circle cx="105" cy="272" r="4" fill="#3fb950"/><text x="122" y="277">Marketing Content</text>
      <circle cx="330" cy="182" r="4" fill="#3fb950"/><text x="347" y="187">Tracking Links</text>
      <circle cx="330" cy="212" r="4" fill="#3fb950"/><text x="347" y="217">List-Unsubscribe</text>
      <circle cx="330" cy="242" r="4" fill="#3fb950"/><text x="347" y="247">No Attachments</text>
    </g>
  </g>

  <!-- Quadrant 2: SUPPORTED -->
  <g>
    <rect x="610" y="100" width="530" height="270" rx="10" fill="#0d1421" stroke="#58a6ff" stroke-width="1.8"/>
    <text x="875" y="134" font-family="Consolas,monospace" font-size="14" fill="#58a6ff" text-anchor="middle" font-weight="700" letter-spacing="1">SUPPORTED</text>
    <line x1="640" y1="150" x2="1110" y2="150" stroke="#1c2b40"/>
    <rect x="690" y="184" width="400" height="70" rx="8" fill="#111827" stroke="#58a6ff" stroke-width="1.4"/>
    <text x="890" y="215" font-family="Consolas,monospace" font-size="12.5" fill="#e6edf3" text-anchor="middle">Legitimate Marketing</text>
    <text x="890" y="238" font-family="Consolas,monospace" font-size="12.5" fill="#58a6ff" text-anchor="middle" font-weight="700">Infrastructure + Campaign</text>
    <text x="875" y="300" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">convergência entre autenticação,</text>
    <text x="875" y="320" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">infraestrutura e conteúdo</text>
  </g>

  <!-- Quadrant 3: NOT OBSERVED -->
  <g>
    <rect x="60" y="390" width="530" height="270" rx="10" fill="#15161a" stroke="#8b949e" stroke-width="1.8" stroke-dasharray="5 4"/>
    <text x="325" y="424" font-family="Consolas,monospace" font-size="14" fill="#8b949e" text-anchor="middle" font-weight="700" letter-spacing="1">NOT OBSERVED</text>
    <line x1="90" y1="440" x2="560" y2="440" stroke="#2a2d33"/>
    <g font-family="Consolas,monospace" font-size="13" fill="#8b949e">
      <circle cx="105" cy="472" r="4" fill="#8b949e"/><text x="122" y="477">Credential Harvesting</text>
      <circle cx="105" cy="502" r="4" fill="#8b949e"/><text x="122" y="507">Malicious Attachment</text>
      <circle cx="330" cy="472" r="4" fill="#8b949e"/><text x="347" y="477">Brand Impersonation</text>
      <circle cx="330" cy="502" r="4" fill="#8b949e"/><text x="347" y="507">Malicious Redirect</text>
    </g>
    <text x="325" y="630" font-family="Segoe UI,Arial,sans-serif" font-size="11.5" fill="#6b7280" text-anchor="middle">buscado nas fontes disponíveis — não encontrado</text>
  </g>

  <!-- Quadrant 4: NOT CONFIRMED -->
  <g>
    <rect x="610" y="390" width="530" height="270" rx="10" fill="#1a1608" stroke="#d29922" stroke-width="1.8"/>
    <text x="875" y="424" font-family="Consolas,monospace" font-size="14" fill="#d29922" text-anchor="middle" font-weight="700" letter-spacing="1">NOT CONFIRMED</text>
    <line x1="640" y1="440" x2="1110" y2="440" stroke="#3a2f10"/>
    <g font-family="Consolas,monospace" font-size="13.5" fill="#e6edf3">
      <circle cx="700" cy="480" r="4" fill="#d29922"/><text x="717" y="485">Phishing</text>
      <circle cx="700" cy="516" r="4" fill="#d29922"/><text x="717" y="521">Malware</text>
      <circle cx="700" cy="552" r="4" fill="#d29922"/><text x="717" y="557">Security Impact</text>
    </g>
    <text x="875" y="630" font-family="Segoe UI,Arial,sans-serif" font-size="11.5" fill="#6b7280" text-anchor="middle">um registro histórico isolado não sustenta a conclusão sozinho</text>
  </g>

  <rect x="280" y="690" width="640" height="80" rx="8" fill="#0d1421" stroke="#3fb950" stroke-width="1.8"/>
  <text x="600" y="722" font-family="Consolas,monospace" font-size="14" fill="#e6edf3" text-anchor="middle" font-weight="700">AUTHENTICATION + CONTENT + INFRASTRUCTURE + REPUTATION</text>
  <text x="600" y="748" font-family="Consolas,monospace" font-size="15" fill="#3fb950" text-anchor="middle" font-weight="700">= VERDICT</text>
</svg>
