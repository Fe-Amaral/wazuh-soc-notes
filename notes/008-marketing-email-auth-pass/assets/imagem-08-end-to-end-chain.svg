    <text x="1405" y="204" font-size="9.5" fill="#8b949e" text-anchor="middle" font-weight="400">Authenticated</text>
    <text x="1405" y="218" font-size="9.5" fill="#8b949e" text-anchor="middle" font-weight="400">promotional</text>
    <text x="1405" y="240" font-size="11" fill="#3fb950" text-anchor="middle" font-weight="700">LEGÍTIMO</text>
