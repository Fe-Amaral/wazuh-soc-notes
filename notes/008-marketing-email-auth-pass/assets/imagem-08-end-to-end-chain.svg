  <text x="750" y="330" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#8b949e" text-anchor="middle">reporte → artefatos → header → autenticação → conteúdo → infraestrutura → reputação → evidência → veredito</text>
  <text x="750" y="356" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">sem parar em SPF/DKIM/DMARC PASS</text>
</svg>
