    <text x="410" y="226" font-size="9" fill="#e6edf3" text-anchor="middle" font-weight="400">/ Received</text>
    <line x1="482" y1="200" x2="498" y2="200" stroke="#4b5563" stroke-width="1.8" marker-end="url(#arrow08h)"/>

