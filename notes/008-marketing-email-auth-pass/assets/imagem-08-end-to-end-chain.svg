    <text x="575" y="232" font-size="10" fill="#3fb950" text-anchor="middle" font-weight="700">PASS</text>
    <line x1="652" y1="200" x2="668" y2="200" stroke="#4b5563" stroke-width="1.8" marker-end="url(#arrow08h)"/>

