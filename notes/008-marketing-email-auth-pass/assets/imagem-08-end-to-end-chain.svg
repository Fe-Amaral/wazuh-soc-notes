<svg viewBox="0 0 1500 460" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow08h" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#4b5563"/>
    </marker>
  </defs>
  <rect width="1500" height="460" fill="#0a0e14"/>
