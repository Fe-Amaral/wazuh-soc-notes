    <text x="1235" y="216" font-size="8" fill="#e6edf3" text-anchor="middle" font-weight="400">Credential Harvest =</text>
    <text x="1235" y="228" font-size="8" fill="#e6edf3" text-anchor="middle" font-weight="400">NOT OBSERVED</text>
    <text x="1235" y="246" font-size="8" fill="#e6edf3" text-anchor="middle" font-weight="400">Marketing Infra =</text>
    <text x="1235" y="258" font-size="8" fill="#e6edf3" text-anchor="middle" font-weight="400">SUPPORTED</text>
    <line x1="1312" y1="200" x2="1328" y2="200" stroke="#4b5563" stroke-width="1.8" marker-end="url(#arrow08h)"/>

