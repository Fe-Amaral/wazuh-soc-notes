<svg viewBox="0 0 1200 780" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="780" fill="#0a0e14"/>
  <text x="600" y="46" font-family="Consolas,monospace" font-size="15" fill="#8b949e" text-anchor="middle" letter-spacing="3">FRAMEWORK APPLICABILITY MAP</text>
  <line x1="440" y1="62" x2="760" y2="62" stroke="#21262d" stroke-width="1"/>

  <!-- Tier 1: DIRECT -->
  <g transform="translate(60,96)">
    <rect width="1080" height="128" rx="10" fill="#0f1f14" stroke="#3fb950" stroke-width="1.8"/>
    <rect width="10" height="128" fill="#3fb950"/>
    <text x="36" y="38" font-family="Consolas,monospace" font-size="15" fill="#3fb950" font-weight="700" letter-spacing="1">DIRECT</text>
    <text x="36" y="60" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#8b949e">estrutura diretamente a investigação, resposta e classificação</text>
    <g font-family="Consolas,monospace" font-size="14" fill="#e6edf3">
      <rect x="36" y="76" width="230" height="38" rx="19" fill="#0a0e14" stroke="#3fb950" stroke-width="1.3"/>
      <text x="151" y="100" text-anchor="middle">NIST CSF</text>
      <rect x="286" y="76" width="260" height="38" rx="19" fill="#0a0e14" stroke="#3fb950" stroke-width="1.3"/>
      <text x="416" y="100" text-anchor="middle" font-size="13">NIST SP 800-61</text>
    </g>
  </g>

  <!-- Tier 2: SUPPORTING -->
  <g transform="translate(60,244)">
    <rect width="1080" height="120" rx="10" fill="#1a1608" stroke="#d29922" stroke-width="1.8"/>
    <rect width="10" height="120" fill="#d29922"/>
    <text x="36" y="36" font-family="Consolas,monospace" font-size="15" fill="#d29922" font-weight="700" letter-spacing="1">SUPPORTING</text>
    <text x="36" y="58" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#8b949e">complementam controle, classificação e maturidade</text>
    <g font-family="Consolas,monospace" font-size="13.5" fill="#e6edf3">
      <rect x="36" y="72" width="170" height="36" rx="18" fill="#0a0e14" stroke="#d29922" stroke-width="1.3"/>
      <text x="121" y="95" text-anchor="middle">D3FEND</text>
      <rect x="216" y="72" width="150" height="36" rx="18" fill="#0a0e14" stroke="#d29922" stroke-width="1.3"/>
      <text x="291" y="95" text-anchor="middle">VERIS</text>
      <rect x="376" y="72" width="200" height="36" rx="18" fill="#0a0e14" stroke="#d29922" stroke-width="1.3"/>
      <text x="476" y="95" text-anchor="middle">CIS Controls</text>
      <rect x="586" y="72" width="180" height="36" rx="18" fill="#0a0e14" stroke="#d29922" stroke-width="1.3"/>
      <text x="676" y="95" text-anchor="middle">SOC-CMM</text>
    </g>
  </g>

  <!-- Tier 3: PARTIAL / LIMITED -->
  <g transform="translate(60,382)">
    <rect width="1080" height="120" rx="10" fill="#0d1b26" stroke="#58a6ff" stroke-width="1.6"/>
    <rect width="10" height="120" fill="#58a6ff"/>
    <text x="36" y="36" font-family="Consolas,monospace" font-size="15" fill="#58a6ff" font-weight="700" letter-spacing="1">PARTIAL / LIMITED</text>
    <text x="36" y="58" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#8b949e">similaridade técnica — não confirma comportamento adversarial</text>
    <g font-family="Consolas,monospace" font-size="13.5" fill="#e6edf3">
      <rect x="36" y="72" width="220" height="36" rx="18" fill="#0a0e14" stroke="#58a6ff" stroke-width="1.3"/>
      <text x="146" y="95" text-anchor="middle">MITRE ATT&amp;CK</text>
      <rect x="266" y="72" width="220" height="36" rx="18" fill="#0a0e14" stroke="#58a6ff" stroke-width="1.3"/>
      <text x="376" y="95" text-anchor="middle" font-size="12.5">MITRE Attack Flow</text>
      <rect x="496" y="72" width="140" height="36" rx="18" fill="#0a0e14" stroke="#58a6ff" stroke-width="1.3"/>
      <text x="566" y="95" text-anchor="middle">Sigma</text>
    </g>
  </g>

  <!-- Tier 4: NOT APPLICABLE -->
  <g transform="translate(60,520)">
    <rect width="1080" height="100" rx="10" fill="#131720" stroke="#4b5563" stroke-width="1.6"/>
    <rect width="10" height="100" fill="#4b5563"/>
    <text x="36" y="36" font-family="Consolas,monospace" font-size="15" fill="#9aa4b2" font-weight="700" letter-spacing="1">NOT APPLICABLE</text>
    <text x="36" y="58" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#6b7280">sem aderência técnica a este caso</text>
    <g font-family="Consolas,monospace" font-size="13" fill="#9aa4b2">
      <rect x="36" y="70" width="160" height="34" rx="17" fill="none" stroke="#4b5563" stroke-width="1.3" stroke-dasharray="3 3"/>
      <text x="116" y="92" text-anchor="middle">MITRE Engage</text>
      <rect x="216" y="70" width="270" height="34" rx="17" fill="none" stroke="#4b5563" stroke-width="1.3" stroke-dasharray="3 3"/>
      <text x="351" y="92" text-anchor="middle" font-size="12.5">Fight Fraud Framework</text>
    </g>
  </g>

  <text x="600" y="670" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#8b949e" text-anchor="middle">similaridade técnica com uma técnica adversarial não confirma execução adversarial</text>
</svg>
