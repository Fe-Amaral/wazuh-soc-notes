<svg viewBox="0 0 1200 650" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow05b" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#8b949e"/>
    </marker>
    <marker id="arrow05r" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#f85149"/>
    </marker>
  </defs>
  <rect width="1200" height="650" fill="#0a0e14"/>
  <text x="600" y="46" font-family="Consolas,monospace" font-size="15" fill="#8b949e" text-anchor="middle" letter-spacing="3">ARQUITETURA DA REQUISIÇÃO</text>
  <line x1="470" y1="62" x2="730" y2="62" stroke="#21262d" stroke-width="1"/>

  <text x="100" y="118" font-family="Consolas,monospace" font-size="12" fill="#c9d1d9" letter-spacing="1">INTERNET</text>
  <circle cx="150" cy="330" r="38" fill="#111827" stroke="#58a6ff" stroke-width="2.2"/>
  <text x="150" y="326" font-family="Consolas,monospace" font-size="11" fill="#58a6ff" text-anchor="middle">SOURCE</text>
  <text x="150" y="340" font-family="Consolas,monospace" font-size="11" fill="#58a6ff" text-anchor="middle">?</text>
  <line x1="188" y1="330" x2="248" y2="330" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow05b)"/>

  <!-- CLOUDFLARE boundary -->
  <rect x="260" y="180" width="480" height="300" rx="12" fill="none" stroke="#f0883e" stroke-width="1.5" stroke-dasharray="8 5"/>
  <text x="284" y="208" font-family="Consolas,monospace" font-size="13" fill="#f0883e" letter-spacing="1">CLOUDFLARE MANAGED PERIMETER</text>

  <rect x="300" y="300" width="120" height="60" rx="8" fill="#0d1421" stroke="#58a6ff" stroke-width="1.8"/>
  <text x="360" y="336" font-family="Consolas,monospace" font-size="13" fill="#58a6ff" text-anchor="middle" font-weight="700">EDGE</text>
  <line x1="420" y1="330" x2="470" y2="330" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow05b)"/>

  <rect x="480" y="290" width="220" height="80" rx="8" fill="#1a1608" stroke="#d29922" stroke-width="2"/>
  <text x="590" y="322" font-family="Consolas,monospace" font-size="14" fill="#d29922" text-anchor="middle" font-weight="700">WAF INSPECTION</text>
  <text x="590" y="344" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">security rule evaluation</text>

  <line x1="590" y1="370" x2="590" y2="430" stroke="#f85149" stroke-width="2.4" marker-end="url(#arrow05r)"/>

  <rect x="800" y="290" width="130" height="70" rx="8" fill="#1f1212" stroke="#f85149" stroke-width="2"/>
  <text x="865" y="330" font-family="Consolas,monospace" font-size="16" fill="#f85149" text-anchor="middle" font-weight="700">BLOCK</text>
  <line x1="700" y1="330" x2="794" y2="330" stroke="#f85149" stroke-width="2.4" stroke-dasharray="1 0" marker-end="url(#arrow05r)"/>

  <!-- Origin, unreached -->
  <rect x="990" y="300" width="160" height="60" rx="8" fill="none" stroke="#4b5563" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="1070" y="322" font-family="Consolas,monospace" font-size="11.5" fill="#6b7280" text-anchor="middle">ORIGIN</text>
  <text x="1070" y="342" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#4b5563" text-anchor="middle">not reached by this request</text>
  <line x1="930" y1="330" x2="984" y2="330" stroke="#4b5563" stroke-width="1.6" stroke-dasharray="3 3"/>

  <rect x="590" y="480" width="330" height="80" rx="8" fill="#0f1f14" stroke="#3fb950" stroke-width="1.6"/>
  <text x="755" y="512" font-family="Consolas,monospace" font-size="13" fill="#3fb950" text-anchor="middle" font-weight="700">POR QUE ISSO IMPORTA</text>
  <text x="755" y="536" font-family="Segoe UI,Arial,sans-serif" font-size="11.5" fill="#8b949e" text-anchor="middle">a requisição analisada foi bloqueada pelo WAF</text>
  <text x="755" y="553" font-family="Segoe UI,Arial,sans-serif" font-size="11.5" fill="#8b949e" text-anchor="middle">antes do encaminhamento ao origin</text>
</svg>
